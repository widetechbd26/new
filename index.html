<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Welcome to WIDE TECH BD</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: #f7faff;
      color: #0b1f33;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Background shapes */
    body::before {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      background: #034b95;
      opacity: 0.08;
      border-radius: 50%;
      top: -180px;
      left: -150px;
      filter: blur(20px);
    }

    body::after {
      content: "";
      position: fixed;
      width: 450px;
      height: 450px;
      background: #38a0ff;
      opacity: 0.08;
      border-radius: 50%;
      bottom: -180px;
      right: -150px;
      filter: blur(20px);
    }

    .container {
      width: 92%;
      max-width: 1100px;
      position: relative;
      z-index: 2;
    }

    .card {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border: 1px solid rgba(3, 75, 149, 0.08);
      border-radius: 32px;

      padding: 70px 60px;
      text-align: center;

      box-shadow:
        0 30px 80px rgba(3, 75, 149, 0.10),
        0 5px 20px rgba(0, 0, 0, 0.03);
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 28px;

      border-radius: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(
        135deg,
        #034b95,
        #0875d1
      );

      color: white;
      font-size: 28px;
      font-weight: 800;

      box-shadow:
        0 15px 35px rgba(3, 75, 149, 0.25);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 9px 16px;
      border-radius: 50px;

      background: #eef6ff;
      color: #034b95;

      font-size: 13px;
      font-weight: 700;

      margin-bottom: 22px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #18a558;
      box-shadow: 0 0 0 5px rgba(24, 165, 88, 0.10);
    }

    h1 {
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1.05;
      letter-spacing: -3px;
      font-weight: 800;
      margin-bottom: 22px;
    }

    h1 span {
      color: #034b95;
    }

    .description {
      max-width: 650px;
      margin: auto;

      color: #62758a;
      font-size: 18px;
      line-height: 1.7;
    }

    .buttons {
      margin-top: 36px;

      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      padding: 15px 25px;
      border-radius: 12px;

      font-size: 15px;
      font-weight: 700;

      transition: 0.25s ease;
    }

    .primary {
      background: #034b95;
      color: white;

      box-shadow:
        0 10px 25px rgba(3, 75, 149, 0.20);
    }

    .primary:hover {
      background: #023c79;
      transform: translateY(-2px);
    }

    .secondary {
      background: white;
      color: #034b95;
      border: 1px solid #dce8f4;
    }

    .secondary:hover {
      border-color: #034b95;
      transform: translateY(-2px);
    }

    .bottom {
      margin-top: 45px;

      display: flex;
      justify-content: center;
      gap: 35px;
      flex-wrap: wrap;

      color: #8090a1;
      font-size: 13px;
    }

    .bottom strong {
      color: #263c52;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .card {
        padding: 45px 22px;
        border-radius: 24px;
      }

      .logo {
        width: 65px;
        height: 65px;
        border-radius: 18px;
      }

      h1 {
        letter-spacing: -2px;
      }

      .description {
        font-size: 16px;
      }

      .buttons {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .bottom {
        gap: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="card">

      <div class="logo">
        WT
      </div>

      <div class="badge">
        <span class="dot"></span>
        Welcome to our digital world
      </div>

      <h1>
        Welcome to
        <br>
        <span>WIDE TECH BD</span>
      </h1>

      <p class="description">
        We build smart digital experiences, modern software solutions,
        and technology that helps businesses move forward with confidence.
      </p>

      <div class="buttons">
        <a href="https://widetechbd.com/" class="btn primary">
          Explore WIDE TECH BD →
        </a>

        <a href="#about" class="btn secondary">
          Discover More
        </a>
      </div>

      <div class="bottom">
        <div>
          <strong>Smart</strong> Solutions
        </div>

        <div>
          <strong>Modern</strong> Technology
        </div>

        <div>
          <strong>Human</strong> Experience
        </div>
      </div>

    </section>

  </main>

</body>
</html>
